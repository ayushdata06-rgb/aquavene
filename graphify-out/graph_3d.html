    let particlesEnabled = true;
    let is3D = true;

    const elem = document.getElementById('3d-graph');
    const Graph = ForceGraph3D()(elem)
      .graphData(gData)
      .backgroundColor('#07090e')
      .nodeId('id')
      .nodeLabel(node => `
        <div style="background: rgba(15, 23, 42, 0.95); padding: 8px 12px; border-radius: 6px; border: 1px solid #38bdf8; font-family: sans-serif; box-shadow: 0 4px 14px rgba(0,0,0,0.5);">
          <div style="font-weight: bold; color: #ffffff; font-size: 13px;">${node.label}</div>
          <div style="color: #94a3b8; font-size: 11px; margin-top: 3px;">${node.community_name} &bull; ${node.degree} links</div>
          <div style="color: #38bdf8; font-size: 10px; margin-top: 2px;">${node.source_file} ${node.source_location}</div>
        </div>
      `)
      .nodeVal('val')
      .nodeColor('color')
      .nodeResolution(16)
      .linkOpacity(0.3)
      .linkColor(() => '#334155')
      .linkWidth(0.8)
      .linkDirectionalParticles(particlesEnabled ? 2 : 0)
      .linkDirectionalParticleWidth(1.4)
      .linkDirectionalParticleSpeed(0.005)
      .linkDirectionalParticleColor(() => '#38bdf8')
      .onNodeClick(node => {
        // Fly camera to node
        const distance = 60;
        const distRatio = 1 + distance / Math.hypot(node.x, node.y, node.z);
        Graph.cameraPosition(
          { x: node.x * distRatio, y: node.y * distRatio, z: node.z * distRatio },
          node,
          1500
        );

        // Update Details Panel
        document.getElementById('info-name').textContent = node.label;
        document.getElementById('info-type').textContent = node.file_type || 'code';
        document.getElementById('info-community').innerHTML = `<span class="tag" style="background: ${node.color}22; color: ${node.color}; border-color: ${node.color}88">${node.community_name}</span>`;
        document.getElementById('info-degree').textContent = `${node.degree} connected relationships`;
        document.getElementById('info-file').textContent = `${node.source_file} ${node.source_location}`;
      });

    // Warm-up simulation for immediate aesthetic positioning
    Graph.d3Force('charge').strength(-120);

    // Initial camera position
    Graph.cameraPosition({ x: 0, y: 0, z: 450 });

    // Reset View Button
    document.getElementById('btn-reset').addEventListener('click', () => {
      Graph.cameraPosition({ x: 0, y: 0, z: 450 }, { x: 0, y: 0, z: 0 }, 1200);
    });

    // Particle Toggle
    document.getElementById('btn-particles').addEventListener('click', function() {
      particlesEnabled = !particlesEnabled;
      Graph.linkDirectionalParticles(particlesEnabled ? 2 : 0);
      this.classList.toggle('active', particlesEnabled);
    });

    // 2D / 3D Mode Toggle
    document.getElementById('btn-dimension').addEventListener('click', function() {
      is3D = !is3D;
      Graph.numDimensions(is3D ? 3 : 2);
      this.textContent = is3D ? '🌐 3D Mode' : '📐 2D Mode';
      this.classList.toggle('active', !is3D);
    });

    // Search Box
    document.getElementById('search-box').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        const query = e.target.value.trim().toLowerCase();
        if (!query) return;

        const matched = gData.nodes.find(n => 
          n.label.toLowerCase().includes(query) || 
          n.id.toLowerCase().includes(query) ||
          n.source_file.toLowerCase().includes(query)
        );

        if (matched) {
          const distance = 50;
          const distRatio = 1 + distance / Math.hypot(matched.x || 1, matched.y || 1, matched.z || 1);
          Graph.cameraPosition(
            { x: (matched.x || 0) * distRatio, y: (matched.y || 0) * distRatio, z: (matched.z || 0) * distRatio },
            matched,
            1800
          );

          // Update info
          document.getElementById('info-name').textContent = matched.label;
          document.getElementById('info-type').textContent = matched.file_type || 'code';
          document.getElementById('info-community').innerHTML = `<span class="tag" style="background: ${matched.color}22; color: ${matched.color}; border-color: ${matched.color}88">${matched.community_name}</span>`;
          document.getElementById('info-degree').textContent = `${matched.degree} connections`;
          document.getElementById('info-file').textContent = `${matched.source_file} ${matched.source_location}`;
        } else {
          alert('Symbol not found: ' + query);
        }
      }
    });

    // Community Filter
    document.getElementById('community-filter').addEventListener('change', (e) => {
      const val = e.target.value;
      if (val === 'ALL') {
        Graph.graphData(gData);
      } else {
        const commId = parseInt(val, 10);
        const filteredNodes = gData.nodes.filter(n => n.community === commId);
        const nodeIds = new Set(filteredNodes.map(n => n.id));
        const filteredLinks = gData.links.filter(l => 
          nodeIds.has(typeof l.source === 'object' ? l.source.id : l.source) &&
          nodeIds.has(typeof l.target === 'object' ? l.target.id : l.target)
        );
        Graph.graphData({ nodes: filteredNodes, links: filteredLinks });
      }
    });

    // Window Resize
    window.addEventListener('resize', () => {
      Graph.width(window.innerWidth);
      Graph.height(window.innerHeight);
    });
  </script>
